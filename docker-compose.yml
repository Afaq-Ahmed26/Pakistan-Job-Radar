services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_radar
      POSTGRES_USER: job_radar
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_radar -d job_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: docker-development-only-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://job_radar:change-me@db:5432/job_radar
      SCRAPER_USER_AGENT: PakistanJobRadar/0.1 (+project-contact)
      SCRAPER_TIMEOUT_SECONDS: "15"
      SCRAPER_MIN_DELAY_SECONDS: "2"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
